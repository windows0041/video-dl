<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频下载器</title>
<style>
  :root {
    --bg: #0f1420; --card: #171e2e; --card2: #1d2639; --line: #2a3550;
    --text: #e8edf7; --dim: #8b98b8; --accent: #4f8cff; --ok: #37c26e; --err: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; padding: 24px 16px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  h1 .sub { color: var(--dim); font-size: 12px; font-weight: normal; margin-left: 8px; }
  .hint { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }
  textarea, input, select {
    width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; font: 13px/1.5 Consolas, "Microsoft YaHei", monospace;
    outline: none;
  }
  textarea:focus, input:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; }
  .row { display: flex; gap: 10px; align-items: flex-end; margin-top: 12px; flex-wrap: wrap; }
  .row .grow { flex: 1; min-width: 140px; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 9px 18px;
    font-size: 14px; cursor: pointer; transition: filter .15s;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--dim); }
  button.ghost:hover { border-color: var(--accent); color: var(--text); }
  button.mini { padding: 2px 10px; font-size: 12px; background: var(--card2); border: 1px solid var(--line); color: var(--dim); }
  button.mini:hover { color: var(--text); }
  .statusbar { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.on { background: var(--ok); animation: pulse 1.2s infinite; }
  .dot.err { background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }
  #job { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
  .logbox {
    background: #0a0e17; border: 1px solid var(--line); border-radius: 6px; height: 240px;
    overflow-y: auto; padding: 10px; font: 12px/1.55 Consolas, monospace; color: #b9c4dd; white-space: pre-wrap; word-break: break-all;
  }
  .logbox .ln-ok { color: var(--ok); } .logbox .ln-err { color: var(--err); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-size: 12px; font-weight: normal; }
  td.name { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.filelink { color: var(--accent); text-decoration: none; }
  a.filelink:hover { text-decoration: underline; }
  .foot { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 12px; margin-top: 18px; }
  .chk { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; margin-top: 10px; }
  .chk input { width: auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📥 视频下载器<span class="sub">yt-dlp 本地版 · 支持 B站 / 抖音 / YouTube / 大部分网站</span></h1>
  <p class="hint">粘贴链接和 Cookie(可选)→ 开始下载 → 完成后在下方列表保存。文件保存在本程序 downloads 文件夹里。</p>

  <div class="card">
    <label>视频链接(一行一个,可多个;支持 BV 号直链、分享短链、抖音/YouTube 链接等)</label>
    <textarea id="url" rows="2" placeholder="https://www.bilibili.com/video/BV1WqY16nEcb&#10;https://v.douyin.com/xxxx/"></textarea>

    <label>Cookie(可不填;B 站填了登录态 Cookie 才能拿最高画质。从浏览器 F12 复制整串即可)</label>
    <textarea id="cookie" rows="3" placeholder="SESSDATA=...; bili_jct=...; DedeUserID=..."></textarea>
    <div class="chk">
      <input type="checkbox" id="fromEdge">
      <label for="fromEdge" style="margin:0">不粘贴,直接读取 Edge 浏览器里的 Cookie(需 Edge 已登录)</label>
    </div>

    <label>代理(可不填;开了 Clash/V2Ray 等代理工具时填,常见如 http://127.0.0.1:7890。连接被拒绝/超时时可试试)</label>
    <input id="proxy" placeholder="http://127.0.0.1:7890">

    <div class="row">
      <div class="grow">
        <label>清晰度</label>
        <select id="quality">
          <option value="best" selected>最高画质(推荐)</option>
          <option value="1080p">不超过 1080p</option>
          <option value="720p">不超过 720p</option>
          <option value="480p">不超过 480p</option>
          <option value="audio">仅音频</option>
        </select>
      </div>
      <button id="btnStart">⬇ 开始下载</button>
      <button id="btnStop" class="ghost" disabled>■ 停止</button>
    </div>

    <div class="statusbar">
      <span class="dot" id="dot"></span>
      <span id="statusText">空闲</span>
      <span id="job"></span>
    </div>
  </div>

  <div class="card">
    <label>实时日志</label>
    <div class="logbox" id="log"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <label style="margin:0">已下载的文件</label>
      <span>
        <button class="mini" id="btnRefresh">刷新列表</button>
        <button class="mini" id="btnOpenDir">打开下载文件夹</button>
      </span>
    </div>
    <table>
      <thead><tr><th>文件名</th><th>大小</th><th>时间</th><th></th></tr></thead>
      <tbody id="files"></tbody>
    </table>
  </div>

  <div class="foot">
    <span id="toolsInfo">检查工具中…</span>
    <button class="ghost" id="btnShutdown">关闭服务器</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const logBox = $('log');
let es = null;

function fmtSize(n) {
  if (n > 1048576) return (n / 1048576).toFixed(2) + ' MB';
  if (n > 1024) return (n / 1024).toFixed(0) + ' KB';
  return n + ' B';
}
function fmtTime(ms) {
  const d = new Date(ms);
  const p = (x) => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function addLine(line) {
  const div = document.createElement('div');
  if (/完成 \(exit 0\)/.test(line)) div.className = 'ln-ok';
  else if (/错误|exit [1-9]|ERROR|Error/.test(line)) div.className = 'ln-err';
  div.textContent = line;
  logBox.appendChild(div);
  while (logBox.children.length > 500) logBox.removeChild(logBox.firstChild);
  logBox.scrollTop = logBox.scrollHeight;
}
function setRunning(running, job) {
  $('dot').className = 'dot' + (running ? ' on' : '');
  $('statusText').textContent = running ? '下载中…' : '空闲';
  $('btnStart').disabled = running;
  $('btnStop').disabled = !running;
  if (job) $('job').textContent = job;
}

async function refreshFiles() {
  const s = await (await fetch('/api/status')).json();
  const tb = $('files');
  tb.innerHTML = '';
  if (!s.files.length) {
    tb.innerHTML = '<tr><td colspan="4" style="color:var(--dim)">还没有文件</td></tr>';
  }
  for (const f of s.files) {
    const tr = document.createElement('tr');
    const q = encodeURIComponent(f.name);
    tr.innerHTML = `<td class="name" title="${f.name}">${f.name}</td>
      <td>${fmtSize(f.size)}</td>
      <td>${fmtTime(f.mtime)}</td>
      <td><a class="filelink" href="/api/file?name=${q}">保存</a></td>`;
    tb.appendChild(tr);
  }
  $('toolsInfo').textContent = (s.tools.ytDlp && s.tools.ffmpeg)
    ? 'yt-dlp ✓  ffmpeg ✓  (工具齐全)'
    : '⚠ 工具缺失,请把 yt-dlp.exe / ffmpeg.exe 放进 tools 文件夹';
  if (!es) { setRunning(s.running, s.job || ''); }
}

function connect() {
  es = new EventSource('/api/logs');
  es.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'init') {
      for (const l of m.lines) addLine(l);
      setRunning(m.running, m.job || '');
    } else if (m.type === 'log') {
      addLine(m.line);
    } else if (m.type === 'status') {
      setRunning(m.running, m.job || '');
      refreshFiles();
    }
  };
  es.onerror = () => {
    es.close();
    $('dot').className = 'dot err';
    $('statusText').textContent = '与服务器断开(服务器已关闭?)';
    setTimeout(connect, 2000);
  };
}

$('btnStart').onclick = async () => {
  const payload = {
    urls: $('url').value,
    cookie: $('cookie').value,
    quality: $('quality').value,
    fromBrowser: $('fromEdge').checked ? 'edge' : '',
    proxy: $('proxy').value,
  };
  if (!payload.urls.trim()) { alert('请先粘贴视频链接'); return; }
  try {
    localStorage.setItem('vd_cookie', payload.cookie);
    localStorage.setItem('vd_proxy', payload.proxy);
  } catch {}
  const r = await (await fetch('/api/download', { method: 'POST', body: JSON.stringify(payload) })).json();
  if (!r.ok) { alert(r.error || '启动失败'); }
  else { setRunning(true, payload.urls.split('\n')[0].trim()); }
};

$('btnStop').onclick = async () => { await fetch('/api/stop', { method: 'POST' }); };
$('btnRefresh').onclick = refreshFiles;
$('btnOpenDir').onclick = async () => { await fetch('/api/openfolder', { method: 'POST' }); };
$('btnShutdown').onclick = async () => {
  if (!confirm('确定关闭服务器吗?(下载中的任务会停止)')) return;
  await fetch('/api/shutdown', { method: 'POST' });
  $('statusText').textContent = '服务器已关闭,窗口可以关掉了';
  $('dot').className = 'dot err';
};

try {
  $('cookie').value = localStorage.getItem('vd_cookie') || '';
  $('proxy').value = localStorage.getItem('vd_proxy') || '';
} catch {}
refreshFiles();
connect();
</script>
</body>
</html>
